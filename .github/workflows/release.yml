name: Build and Release QuickHasteBot

on:
  push:
    tags:
      - 'v*'
  # Notfall-Knopf zum Testen, baut dann z.B. "2.1.0-dev.3" (3 Commits nach v2.1.0)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Tags für die Version ohne Tag-Push

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Extract and Parse Version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        if ($tag -notmatch '^v') {
            # Wie VersionFromGit in der csproj: letzter Tag plus Anzahl Commits danach
            $tag = "v0.0.0-dev"
            if ((git describe --tags --long --match 'v[0-9]*') -match '^v(\d+\.\d+\.\d+)-(\d+)-g') {
                $tag = if ($Matches[2] -eq '0') { "v$($Matches[1])" } else { "v$($Matches[1])-dev.$($Matches[2])" }
            }
        }

        $fullVersion = $tag -replace '^v\.?', ''
        $numericVersion = "2.0.0"
        if ($fullVersion -match '^(\d+\.\d+\.\d+(?:\.\d+)?)') {
            $numericVersion = $Matches[1]
        }

        echo "FULL_VERSION=$fullVersion" >> $env:GITHUB_ENV
        echo "NUMERIC_VERSION=$numericVersion" >> $env:GITHUB_ENV

    # Schlägt ein Test fehl, bricht der Workflow hier ab und es entsteht kein Release
    - name: Run Tests
      run: dotnet test tests/QuickHasteBot.Tests/QuickHasteBot.Tests.csproj -c Release

    - name: Publish Single-File Exe
      run: >
        dotnet publish src/QuickHasteBot/QuickHasteBot.csproj -c Release -r win-x64 -o publish
        -p:Version=${{ env.FULL_VERSION }} -p:FileVersion=${{ env.NUMERIC_VERSION }} -p:AssemblyVersion=${{ env.NUMERIC_VERSION }}

    # Für Rechner ohne .NET 10 Desktop Runtime (z.B. wo nur .NET 8 installiert ist): Runtime steckt in der exe
    - name: Publish Standalone Exe
      run: >
        dotnet publish src/QuickHasteBot/QuickHasteBot.csproj -c Release -r win-x64 -o publish-standalone
        -p:SelfContained=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        -p:Version=${{ env.FULL_VERSION }} -p:FileVersion=${{ env.NUMERIC_VERSION }} -p:AssemblyVersion=${{ env.NUMERIC_VERSION }}

    - name: Create Zip Archives
      shell: pwsh
      run: |
        Copy-Item README.md publish -ErrorAction SilentlyContinue
        Copy-Item README.md publish-standalone -ErrorAction SilentlyContinue
        $zipName = "QuickHasteBot-${{ env.FULL_VERSION }}-win-x64.zip"
        $standaloneZipName = "QuickHasteBot-${{ env.FULL_VERSION }}-win-x64-standalone.zip"
        Compress-Archive -Path "publish\*" -DestinationPath $zipName
        Compress-Archive -Path "publish-standalone\*" -DestinationPath $standaloneZipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
        echo "STANDALONE_ZIP_NAME=$standaloneZipName" >> $env:GITHUB_ENV

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ${{ env.ZIP_NAME }}
          ${{ env.STANDALONE_ZIP_NAME }}
        generate_release_notes: true
